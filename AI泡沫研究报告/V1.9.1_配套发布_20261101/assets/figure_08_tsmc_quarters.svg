<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><title>TSMC: quarterly revenue rises while gross margin eases</title><desc>TSMC: quarterly revenue rises while gross margin eases Revenue bars: USD billion. Gross margin and the TWD cash bridge are shown separately; currencies are not mixed. 40.20 Q2 actual 46.72 Q3 actual Gross margin: 67.7% -&gt; 66.4% Revenue in USD: +16.2% QoQ Gross margin: -1.3pp QoQ Q3 operating cash - cash capex = TWD 476.570 billion Does not prove end-user AI projects paid back Sources: TSMC management report, 15 October, p. 1; financial statements, p. 4. Q4 guidance is not plotted as actual revenue. Daduizhang | V1.9 | 2026-10-27 | Actuals retain their stated observation periods</desc><rect width="1100" height="520" fill="#f8fbfd" /><g font-family="Noto Sans SC,Noto,sans-serif"><text x="45" y="48" fill="#315f7d" font-size="28.000" text-anchor="start" font-weight="700" style="font-size:28.000px;font-family:Arial,sans-serif">TSMC: quarterly revenue rises while gross margin eases</text><text x="45" y="82" fill="#5d7485" font-size="17.798" text-anchor="start" font-weight="400" style="font-size:17.798px;font-family:Arial,sans-serif">Revenue bars: USD billion. Gross margin and the TWD cash bridge are shown separately; currencies are not mixed.</text><rect x="140" y="187.04" width="135" height="192.96" fill="#bbd5e5" /><text x="207.5" y="172.04" fill="#315f7d" font-size="25" text-anchor="middle" font-weight="700">40.20</text><text x="207.5" y="414" fill="#315f7d" font-size="22.000" text-anchor="middle" font-weight="400" style="font-size:22.000px;font-family:Arial,sans-serif">Q2 actual</text><rect x="370" y="155.744" width="135" height="224.256" fill="#7daecb" /><text x="437.5" y="140.744" fill="#315f7d" font-size="25" text-anchor="middle" font-weight="700">46.72</text><text x="437.5" y="414" fill="#315f7d" font-size="22.000" text-anchor="middle" font-weight="400" style="font-size:22.000px;font-family:Arial,sans-serif">Q3 actual</text><rect x="650" y="140" width="380" height="265" fill="#edf5fa" rx="10" /><text x="680" y="179" fill="#315f7d" font-size="22.222" text-anchor="start" font-weight="700" style="font-size:22.222px;font-family:Arial,sans-serif">Gross margin: 67.7% -&gt; 66.4%</text><text x="680" y="218" fill="#315f7d" font-size="21.000" text-anchor="start" font-weight="400" style="font-size:21.000px;font-family:Arial,sans-serif">Revenue in USD: +16.2% QoQ</text><text x="680" y="255" fill="#315f7d" font-size="21.000" text-anchor="start" font-weight="400" style="font-size:21.000px;font-family:Arial,sans-serif">Gross margin: -1.3pp QoQ</text><text x="680" y="302" fill="#315f7d" font-size="20.000" text-anchor="start" font-weight="400" style="font-size:20.000px;font-family:Arial,sans-serif">Q3 operating cash - cash capex</text><text x="680" y="342" fill="#315f7d" font-size="23.000" text-anchor="start" font-weight="700" style="font-size:23.000px;font-family:Arial,sans-serif">= TWD 476.570 billion</text><text x="680" y="379" fill="#637b8b" font-size="14.324" text-anchor="start" font-weight="400" style="font-size:14.324px;font-family:Arial,sans-serif">Does not prove end-user AI projects paid back</text><text x="45" y="475" fill="#637b8b" font-size="16.000" text-anchor="start" font-weight="400" style="font-size:16.000px;font-family:Arial,sans-serif">Sources: TSMC management report, 15 October, p. 1; financial statements, p. 4. Q4 guidance is not plotted as actual revenue.</text><text x="45" y="503" fill="#637b8b" font-size="15.000" text-anchor="start" font-weight="400" style="font-size:15.000px;font-family:Arial,sans-serif">Daduizhang | V1.9 | 2026-10-27 | Actuals retain their stated observation periods</text></g></svg>