<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><title>台积电：季度收入继续增长，毛利率边际回落</title><desc>收入柱形为十亿美元；毛利率与新台币现金桥单独标明，不混币种；来源：TSMC 10月15日管理报告第1页、财务表第4页；Q4指引未画成实际收入。</desc><rect width="1100" height="520" fill="#f8fbfd"/><g font-family="Noto Sans SC,Noto,sans-serif"><text x="45" y="48" fill="#315f7d" font-size="28" text-anchor="start" font-weight="700">台积电：季度收入继续增长，毛利率边际回落</text><text x="45" y="82" fill="#5d7485" font-size="18" text-anchor="start" font-weight="400">收入柱形为十亿美元；毛利率与新台币现金桥单独标明，不混币种</text><rect x="140" y="187.04" width="135" height="192.96" fill="#bbd5e5" /><text x="207.5" y="172.04" fill="#315f7d" font-size="25" text-anchor="middle" font-weight="700">40.20</text><text x="207.5" y="414" fill="#315f7d" font-size="22" text-anchor="middle" font-weight="400">Q2 实际</text><rect x="370" y="155.744" width="135" height="224.256" fill="#7daecb" /><text x="437.5" y="140.744" fill="#315f7d" font-size="25" text-anchor="middle" font-weight="700">46.72</text><text x="437.5" y="414" fill="#315f7d" font-size="22" text-anchor="middle" font-weight="400">Q3 实际</text><rect x="650" y="140" width="380" height="265" fill="#edf5fa" rx="10"/><text x="680" y="179" fill="#315f7d" font-size="23" text-anchor="start" font-weight="700">毛利率：67.7% → 66.4%</text><text x="680" y="218" fill="#315f7d" font-size="21" text-anchor="start" font-weight="400">收入美元口径环比 +16.2%</text><text x="680" y="255" fill="#315f7d" font-size="21" text-anchor="start" font-weight="400">毛利率环比 −1.3 个百分点</text><text x="680" y="302" fill="#315f7d" font-size="20" text-anchor="start" font-weight="400">Q3 经营现金 − 现金购建</text><text x="680" y="342" fill="#315f7d" font-size="23" text-anchor="start" font-weight="700">= 476.570 十亿新台币</text><text x="680" y="379" fill="#637b8b" font-size="18" text-anchor="start" font-weight="400">不代表终端AI项目已回本</text><text x="45" y="475" fill="#637b8b" font-size="16" text-anchor="start" font-weight="400">来源：TSMC 10月15日管理报告第1页、财务表第4页；Q4指引未画成实际收入。</text><text x="45" y="503" fill="#637b8b" font-size="15" text-anchor="start" font-weight="400">大队长 · V1.6.1 · 2026-10-27；实际数据各按标注期间</text></g></svg>