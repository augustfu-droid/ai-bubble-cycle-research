<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#fbfdff"/>
  <style>
    text{font-family:"Noto Sans SC","PingFang SC",sans-serif;fill:#263643}
    .title{font-size:34px;font-weight:700;fill:#315e7c}
    .sub{font-size:20px;fill:#607789}
    .label{font-size:20px}
    .value{font-size:22px;font-weight:700}
    .note{font-size:17px;fill:#607789}
    .axis{stroke:#b9cedb;stroke-width:2}
  </style>
  <text x="60" y="62" class="title">Oracle FY27Q1：增长、现金与融资必须同时看</text>
  <text x="60" y="98" class="sub">单位：十亿美元；财季截至2026-08-31。负数向左，正数向右。</text>
  <line x1="390" y1="135" x2="390" y2="520" class="axis"/>

  <text x="60" y="175" class="label">总收入</text>
  <rect x="390" y="145" width="290" height="40" rx="5" fill="#8ebcd6"/>
  <text x="695" y="174" class="value">19.345</text>

  <text x="60" y="235" class="label">经营现金流</text>
  <rect x="390" y="205" width="347" height="40" rx="5" fill="#5f9fc5"/>
  <text x="752" y="234" class="value">23.103</text>

  <text x="60" y="295" class="label">其中：客户预付款</text>
  <rect x="390" y="265" width="170" height="40" rx="5" fill="#b6d6e8"/>
  <text x="575" y="294" class="value">11.363</text>

  <text x="60" y="355" class="label">资本开支</text>
  <rect x="390" y="325" width="427" height="40" rx="5" fill="#315e7c"/>
  <text x="832" y="354" class="value">28.499</text>

  <text x="60" y="415" class="label">自由现金流</text>
  <rect x="309" y="385" width="81" height="40" rx="5" fill="#d58a86"/>
  <text x="218" y="414" class="value">−5.396</text>

  <text x="60" y="475" class="label">ATM增发净到账</text>
  <rect x="390" y="445" width="299" height="40" rx="5" fill="#77adc9"/>
  <text x="704" y="474" class="value">19.909</text>

  <rect x="60" y="545" width="1080" height="105" rx="12" fill="#edf5f9" stroke="#c7dce8"/>
  <text x="85" y="580" class="label">长期义务另表看：RPO 664；尚未起租的数据中心租赁承诺约288，通常15—19年。</text>
  <text x="85" y="614" class="note">RPO、未起租租赁承诺、当季资本开支和ATM融资不是同一种量，图中不相加。</text>
  <text x="85" y="642" class="note">经营现金流含11.363客户预付款且具有重大融资成分；季度报表未经审计。</text>
  <text x="60" y="695" class="note">来源：Oracle 2026-09-10 FY27Q1业绩新闻稿及2026-09-11 Form 10-Q。</text>
</svg>
