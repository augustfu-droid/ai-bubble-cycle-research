<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#F7FAFE"/>
  <rect x="36" y="34" width="1128" height="692" rx="18" fill="#FFFFFF" stroke="#D3DFEE" stroke-width="2"/>
  <text x="78" y="92" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="34" font-weight="700" fill="#002451">Alphabet：当期现金流承压，长期资本锁定加深</text>
  <text x="78" y="132" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="21" fill="#59697D">2026Q2 / 截至2026-06-30｜官方财报与Form 10-Q｜十亿美元</text>

  <rect x="78" y="175" width="468" height="470" rx="14" fill="#F4F8FD" stroke="#BCD0E6"/>
  <text x="112" y="224" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#1C5A9E">当期现金流：流量</text>
  <text x="112" y="257" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#65758A">同一季度口径，可直接比较</text>

  <text x="112" y="318" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#28394C">经营现金流</text>
  <rect x="270" y="291" width="213" height="38" rx="6" fill="#72A7D8"/>
  <text x="493" y="318" text-anchor="end" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#153B63">$39.1B</text>

  <text x="112" y="390" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#28394C">资本开支</text>
  <rect x="270" y="363" width="245" height="38" rx="6" fill="#2D6EAE"/>
  <text x="525" y="390" text-anchor="end" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#153B63">$44.9B</text>

  <line x1="112" y1="438" x2="510" y2="438" stroke="#B7C8DD" stroke-width="2"/>
  <text x="112" y="486" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#28394C">自由现金流</text>
  <rect x="270" y="459" width="32" height="38" rx="6" fill="#C96A64"/>
  <text x="334" y="486" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#9C403A">-$5.9B</text>

  <text x="112" y="552" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#59697D">H1经营现金流 $84.9B</text>
  <text x="112" y="584" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#59697D">H1资本开支 $80.6B</text>
  <text x="112" y="616" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#9C403A">H1自由现金流仅 $4.3B</text>

  <rect x="574" y="175" width="548" height="470" rx="14" fill="#FAFBFD" stroke="#BCD0E6"/>
  <text x="608" y="224" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#1C5A9E">长期资本锁定：存量与或有敞口</text>
  <text x="608" y="257" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#65758A">期限、会计分类不同；严禁直接相加</text>

  <rect x="608" y="292" width="480" height="77" rx="10" fill="#DCEAF7"/>
  <text x="632" y="323" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#28394C">重大采购承诺及其他合同义务</text>
  <text x="1060" y="346" text-anchor="end" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="700" fill="#174F88">$811.0B</text>

  <rect x="632" y="387" width="432" height="77" rx="10" fill="#E8F1FA" stroke="#8FB2D5"/>
  <text x="656" y="418" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#28394C">其中：长期固定或保证承诺</text>
  <text x="1038" y="442" text-anchor="end" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#2B659E">$707.0B</text>

  <rect x="608" y="486" width="220" height="83" rx="10" fill="#F4F7FA" stroke="#AFC2D6"/>
  <text x="626" y="516" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#28394C">尚未开始租约</text>
  <text x="810" y="550" text-anchor="end" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#4E6C89">$85.2B</text>

  <rect x="846" y="486" width="242" height="83" rx="10" fill="#FFF5E4" stroke="#E2C58B"/>
  <text x="866" y="516" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#28394C">金融担保最大潜在付款</text>
  <text x="1068" y="550" text-anchor="end" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#9B6B00">$7.6B</text>

  <text x="608" y="612" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#59697D">长期债务账面值 $98.2B｜现金及有价证券 $242.5B</text>

  <rect x="78" y="668" width="1044" height="34" rx="8" fill="#EEF3F8"/>
  <text x="600" y="692" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#40556D">结论：这不是当期偿债危机，但资本开支已转化为多年采购、租赁与担保锁定。</text>
</svg>
