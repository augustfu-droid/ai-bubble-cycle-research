   <text x="59.472" y="65.124" fill="#61788a" font-family="Arial, sans-serif" font-size="11.000"><tspan x="59.472" dy="0">Issue completed on 22 September | 4.2000 - 0.0630 - 0.5662 = 3.5708B</tspan></text></g>
  <g id="text_17">
   <text x="59.472" y="381.096" fill="#294d6b" font-family="Arial, sans-serif" font-size="10.000"><tspan x="59.472" dy="0">The 3.5708B is before other issuance expenses; capped calls mitigate some conversion dilution and are not operating expenses.</tspan></text></g>
  <g id="text_18">
   <text x="59.472" y="407.628" fill="#294d6b" font-family="Arial, sans-serif" font-size="10.000"><tspan x="59.472" dy="0">Annual cash coupon: 4.2B x 2.875% = USD 120.75 million; this is not the all-in financing cost.</tspan></text></g>
  <g id="text_19">
   <text x="59.472" y="446.22" fill="#718494" font-family="Arial, sans-serif" font-size="9.000"><tspan x="59.472" dy="0">Source: CoreWeave SEC Form 8-K, 22 September 2026, issuance and capped-call terms.</tspan></text></g>
 </g>
