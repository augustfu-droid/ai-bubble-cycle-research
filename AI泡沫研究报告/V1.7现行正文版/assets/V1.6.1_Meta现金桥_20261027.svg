<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><title>Meta：经营现金为正，扣除建设与租赁付款后单季为负</title><desc>2026Q3 · 十亿美元 · 柱高比较金额大小，支出在上方算式中扣减；来源：Meta 10月21日业绩及FCF调节表；前三季度FCF仍为 +11.049，不外推全年。</desc><rect width="1100" height="520" fill="#f8fbfd"/><g font-family="Noto Sans SC,Noto,sans-serif"><text x="45" y="48" fill="#315f7d" font-size="28" text-anchor="start" font-weight="700">Meta：经营现金为正，扣除建设与租赁付款后单季为负</text><text x="45" y="82" fill="#5d7485" font-size="18" text-anchor="start" font-weight="400">2026Q3 · 十亿美元 · 柱高比较金额大小，支出在上方算式中扣减</text><line x1="65" y1="355" x2="1035" y2="355" stroke="#a7c0d0"/><rect x="110" y="177.95559999999998" width="125" height="177.04440000000002" fill="#83b5d3" /><text x="172.5" y="165.95559999999998" fill="#315f7d" font-size="21" text-anchor="middle" font-weight="700">流入 32.786</text><text x="172.5" y="415" fill="#315f7d" font-size="20" text-anchor="middle" font-weight="400">经营现金</text><rect x="360" y="171.7132" width="125" height="183.2868" fill="#a9cce1" /><text x="422.5" y="159.7132" fill="#315f7d" font-size="21" text-anchor="middle" font-weight="700">支出 33.942</text><text x="422.5" y="415" fill="#315f7d" font-size="20" text-anchor="middle" font-weight="400">固定资产付款</text><rect x="610" y="349.7944" width="125" height="5.2056000000000004" fill="#c7dce9" /><text x="672.5" y="337.7944" fill="#315f7d" font-size="21" text-anchor="middle" font-weight="700">支出 0.964</text><text x="672.5" y="415" fill="#315f7d" font-size="20" text-anchor="middle" font-weight="400">租赁本金</text><rect x="860" y="355" width="125" height="11.448000000000002" fill="#a88c78" /><text x="922.5" y="391.448" fill="#315f7d" font-size="21" text-anchor="middle" font-weight="700">-2.120</text><text x="922.5" y="415" fill="#315f7d" font-size="20" text-anchor="middle" font-weight="400">自由现金流</text><text x="550" y="120" fill="#315f7d" font-size="25" text-anchor="middle" font-weight="700">32.786 − 33.942 − 0.964 = −2.120</text><text x="45" y="475" fill="#637b8b" font-size="16" text-anchor="start" font-weight="400">来源：Meta 10月21日业绩及FCF调节表；前三季度FCF仍为 +11.049，不外推全年。</text><text x="45" y="503" fill="#637b8b" font-size="15" text-anchor="start" font-weight="400">大队长 · V1.7 · 2026-10-27；实际数据各按标注期间</text></g></svg>