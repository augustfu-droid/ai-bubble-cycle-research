<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#fbfdff" />
  <style>
    text{font-family:"Noto Sans SC","PingFang SC",sans-serif;fill:#263643}
    .title{font-size:34px;font-weight:700;fill:#315e7c}
    .sub{font-size:20px;fill:#607789}
    .label{font-size:20px}
    .value{font-size:22px;font-weight:700}
    .note{font-size:17px;fill:#607789}
    .axis{stroke:#b9cedb;stroke-width:2}
  </style>
  <text x="60" y="62" class="title" font-size="34.000" style="font-size:34.000px;font-family:Arial,sans-serif">Oracle FY27Q1: read growth, cash and financing together</text>
  <text x="60" y="98" class="sub" font-size="20.000" style="font-size:20.000px;font-family:Arial,sans-serif">USD billion | Quarter ended 2026-08-31 | Negative to the left; positive to the right</text>
  <line x1="390" y1="135" x2="390" y2="520" class="axis" />

  <text x="60" y="175" class="label" font-size="20.000" style="font-size:20.000px;font-family:Arial,sans-serif">Total revenue</text>
  <rect x="390" y="145" width="290" height="40" rx="5" fill="#8ebcd6" />
  <text x="695" y="174" class="value">19.345</text>

  <text x="60" y="235" class="label" font-size="20.000" style="font-size:20.000px;font-family:Arial,sans-serif">Operating cash flow</text>
  <rect x="390" y="205" width="347" height="40" rx="5" fill="#5f9fc5" />
  <text x="752" y="234" class="value">23.103</text>

  <text x="60" y="295" class="label" font-size="20.000" style="font-size:20.000px;font-family:Arial,sans-serif">Of which: customer advances</text>
  <rect x="390" y="265" width="170" height="40" rx="5" fill="#b6d6e8" />
  <text x="575" y="294" class="value">11.363</text>

  <text x="60" y="355" class="label" font-size="20.000" style="font-size:20.000px;font-family:Arial,sans-serif">Capital expenditure</text>
  <rect x="390" y="325" width="427" height="40" rx="5" fill="#315e7c" />
  <text x="832" y="354" class="value">28.499</text>

  <text x="60" y="415" class="label" font-size="20.000" style="font-size:20.000px;font-family:Arial,sans-serif">Free cash flow</text>
  <rect x="309" y="385" width="81" height="40" rx="5" fill="#d58a86" />
  <text x="218" y="414" class="value">−5.396</text>

  <text x="60" y="475" class="label" font-size="20.000" style="font-size:20.000px;font-family:Arial,sans-serif">Net ATM equity proceeds</text>
  <rect x="390" y="445" width="299" height="40" rx="5" fill="#77adc9" />
  <text x="704" y="474" class="value">19.909</text>

  <rect x="60" y="545" width="1080" height="105" rx="12" fill="#edf5f9" stroke="#c7dce8" />
  <text x="85" y="580" class="label" font-size="19.576" style="font-size:19.576px;font-family:Arial,sans-serif">Long-term obligations, separately: RPO 664; uncommenced data-center leases about 288, typically 15-19 years.</text>
  <text x="85" y="614" class="note" font-size="17.000" style="font-size:17.000px;font-family:Arial,sans-serif">RPO, uncommenced leases, quarterly capex and ATM financing are different quantities and are not added together.</text>
  <text x="85" y="642" class="note" font-size="16.688" style="font-size:16.688px;font-family:Arial,sans-serif">Operating cash includes 11.363 of customer advances with a significant financing component; quarterly statements are unaudited.</text>
  <text x="60" y="695" class="note" font-size="17.000" style="font-size:17.000px;font-family:Arial,sans-serif">Sources: Oracle FY27Q1 earnings release, 2026-09-10, and Form 10-Q, 2026-09-11.</text>
</svg>